<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b111b" />
    <title>One Trade — Intraday Journal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">1</div>
          <div>
            <h1>One Trade</h1>
            <small>Intraday journal & consistency tracker</small>
          </div>
        </div>
        <div class="top-actions">
          <span class="local-tag">Local-only · NSE · Asia/Kolkata</span
          ><button class="btn primary" data-go="calculator">
            ＋ Plan a Trade
          </button>
        </div>
      </header>
      <nav class="nav" aria-label="Main navigation" role="tablist">
        <button role="tab" aria-selected="true" data-page="dashboard">
          Dashboard
        </button>
        <button role="tab" aria-selected="false" data-page="calculator">
          Trade Calculator
        </button>
        <button role="tab" aria-selected="false" data-page="journal">
          Journal
        </button>
        <button role="tab" aria-selected="false" data-page="prompt">
          AI Prompt
        </button>
        <button role="tab" aria-selected="false" data-page="playbook">
          Playbook
        </button>
        <button role="tab" aria-selected="false" data-page="analytics">
          Analytics
        </button>
        <button role="tab" aria-selected="false" data-page="settings">
          Export & Settings
        </button>
      </nav>
      <main>
        <section id="dashboard" class="page active" role="tabpanel"></section>
        <section id="calculator" class="page" role="tabpanel"></section>
        <section id="journal" class="page" role="tabpanel"></section>
        <section id="prompt" class="page" role="tabpanel"></section>
        <section id="playbook" class="page" role="tabpanel"></section>
        <section id="analytics" class="page" role="tabpanel"></section>
        <section id="settings" class="page" role="tabpanel"></section>
      </main>
    </div>
    <dialog id="trade-dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js" defer></script>
  </body>
</html>
